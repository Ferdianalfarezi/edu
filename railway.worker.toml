# Railway deployment configuration — Worker service
# Background job processor (BullMQ: notifications, image compression, exports)
# Per ADR-006: 512MB RAM, 0.5 vCPU
#
# To use this file, create a second Railway service in the same project
# and set the config path to "railway.worker.toml" in service settings.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
# Worker has no HTTP endpoint — disable health check path
# Railway will monitor process liveness instead
startCommand = "node apps/api/dist/worker.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
