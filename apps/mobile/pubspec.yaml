name: edu_mobile
description: Teman Sekolah - Mobile App for Guru and Orang Tua
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local Database (Offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Push Notifications (FCM)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # UI Utilities
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # JWT Decoding
  jwt_decoder: ^2.0.1

  # Logging
  logger: ^2.3.0

  # Image Picker (camera/gallery)
  image_picker: ^1.1.2

  # URL Launcher (open external links)
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
