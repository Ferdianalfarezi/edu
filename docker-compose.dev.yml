services:
  postgres:
    image: postgres:16
    container_name: edu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_dev
    ports:
      - "5433:5432"   # 5433 biar tidak bentrok dengan PostgreSQL Laragon
    volumes:
      - edu_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: edu-redis
    ports:
      - "6380:6379"   # 6380 biar tidak bentrok dengan Redis Laragon

  # Penyimpanan file (RPP, logo, dll.), sama seperti SeaweedFS di VPS.
  # Lokal tanpa s3.json = tanpa autentikasi, jadi kunci dummy di .env tetap jalan.
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: edu-s3
    command: server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=100 -volume.max=0 -s3 -s3.port=9000
    ports:
      - "9000:9000"
    volumes:
      - edu_s3data:/data

volumes:
  edu_pgdata:
  edu_s3data: