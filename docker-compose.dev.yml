services:
  postgres:
    image: postgres:16
    container_name: edu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_dev
    ports:
      - "5432:5432"
    volumes:
      - edu_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: edu-redis
    ports:
      - "6379:6379"

volumes:
  edu_pgdata: