# Railway deployment configuration — Admin Panel (Vue.js SPA)
# Static site served via nginx

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.admin"

[build.args]
VITE_API_URL = "${{API_URL}}"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
